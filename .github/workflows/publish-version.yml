name: Publish integration version

on:
  workflow_run:
    workflows: ["Build integration"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-integration-version
  cancel-in-progress: false

jobs:
  tag-and-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Publish driver version tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("driver.json"))["version"])')"
          tag="v${version}"
          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${{ github.event.workflow_run.head_sha }}" -m "Apple TV Keyboard UC Integration ${tag}"
            git push origin "refs/tags/${tag}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi

          # Tags pushed with GITHUB_TOKEN do not trigger push workflows, so explicitly
          # dispatch the build at the immutable tag. The tagged build publishes the release.
          gh workflow run build.yml --ref "${tag}"
