name: Build integration

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate framework imports
        run: |
          python - <<'PY'
          from ucapi_framework import (
              BaseConfigManager,
              BaseDiscovery,
              BaseIntegrationDriver,
              BaseSetupFlow,
              ExternalClientDevice,
              MediaPlayerEntity,
          )
          print("ucapi-framework imports OK")
          PY
      - name: Validate Python sources
        run: python -m compileall -q intg-appletv-keyboard
      - name: Validate driver metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("driver.json").read_text(encoding="utf-8"))
          assert data["driver_id"] == "appletv_keyboard"
          assert data["version"]
          assert data["min_core_api"]
          schema = data.get("setup_data_schema")
          assert isinstance(schema, dict)
          assert schema.get("settings"), "setup_data_schema must be visible to Core at startup"
          print(
              f"driver_id={data['driver_id']} version={data['version']} "
              f"min_core_api={data['min_core_api']}"
          )
          PY

  build:
    needs: validate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("driver.json"))["version"])')"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match driver.json version v${version}" >&2
            exit 1
          fi

      - name: Build ARM64 onedir bundle
        shell: bash
        run: |
          docker run --rm \
            --platform=linux/arm64/v8 \
            --user=$(id -u):$(id -g) \
            -v "$GITHUB_WORKSPACE":/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:3.11.13-0.7.0 \
            bash -c 'cd /workspace && \
              python -m pip install -r requirements.txt && \
              pyinstaller --clean --onedir --name intg-appletv-keyboard \
                --collect-all zeroconf intg-appletv-keyboard/driver.py'

      - name: Package custom integration
        shell: bash
        run: |
          mkdir -p package/bin
          cp -a dist/intg-appletv-keyboard/. package/bin/
          mv package/bin/intg-appletv-keyboard package/bin/driver
          cp driver.json LICENSE package/
          printf '%s\n' "$VERSION" > package/version.txt
          artifact="uc-intg-appletv-keyboard-v${VERSION}-aarch64.tar.gz"
          tar -czf "$artifact" -C package .
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"
          sha256sum "$artifact" | tee "${artifact}.sha256"
          ls -lh "$artifact" "${artifact}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: uc-intg-appletv-keyboard-v${{ env.VERSION }}-aarch64
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$ARTIFACT" "${ARTIFACT}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Apple TV Keyboard UC Integration $GITHUB_REF_NAME" \
            --generate-notes
